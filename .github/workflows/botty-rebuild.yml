name: SoulRunner Nova Pindle Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          repository: johannes-do/botty
          ref: master
          path: botty
      - name: Configure Nova Sorc Pindle only
        shell: powershell
        run: |
          $p = 'botty/config/params.ini'
          $c = Get-Content $p -Raw
          $c = $c -replace '(?m)^name=.*$', 'name=SoulRunner'
          $c = $c -replace '(?m)^order=.*$', 'order=run_pindle'
          $c = $c -replace '(?m)^type=.*$', 'type=nova_sorc'
          $c = $c -replace '(?m)^randomize_runs=.*$', 'randomize_runs=0'
          $c = $c -replace '(?m)^restart_d2r_when_stuck=.*$', 'restart_d2r_when_stuck=0'
          Set-Content $p $c -Encoding UTF8
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: botty
          environment-file: botty/environment.yml
          auto-activate-base: false
      - name: Ensure runtime packaging dependencies
        shell: cmd /C call {0}
        run: |
          python -m pip install --upgrade pyparsing pyinstaller
          python -c "import pyparsing; print('pyparsing', pyparsing.__version__)"
      - name: Build engine with pyparsing bundled
        shell: cmd /C call {0}
        run: |
          cd botty
          pyinstaller --noconfirm --clean --onefile --distpath soulrunner_engine --paths .\src --collect-all pyparsing src\main.py
          mkdir soulrunner_engine\config
          copy config\game.ini soulrunner_engine\config\game.ini
          copy config\params.ini soulrunner_engine\config\params.ini
          copy config\shop.ini soulrunner_engine\config\shop.ini
          copy config\default.bnip soulrunner_engine\config\default.bnip
          xcopy assets soulrunner_engine\assets\ /E /I /Y
      - name: Build SoulRunner launcher
        shell: cmd /C call {0}
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SoulRunner soulrunner_launcher.py
      - name: Package SoulRunner
        shell: powershell
        run: |
          if (-not (Test-Path 'botty/soulrunner_engine/main.exe')) { throw 'Engine executable missing' }
          New-Item -ItemType Directory -Force out\engine | Out-Null
          Copy-Item dist\SoulRunner.exe out\SoulRunner.exe
          Copy-Item botty\soulrunner_engine\main.exe out\engine\main.exe
          Copy-Item -Recurse botty\soulrunner_engine\assets out\engine\assets
          Copy-Item -Recurse botty\soulrunner_engine\config out\engine\config
          Copy-Item botty\LICENSE.txt out\LICENSE.txt
          @'
          SOULRUNNER - NOVA PINDLE TEST

          Target: Nova Sorceress, Hell, Pindle only.
          Extract the entire ZIP. Start Diablo II: Resurrected, run SoulRunner.exe, then press F10.
          F11 stops SoulRunner.

          This build explicitly bundles pyparsing and keeps diagnostic engine output in the SoulRunner run log.
          Third-party MIT attribution is included in LICENSE.txt.
          '@ | Set-Content -Encoding UTF8 out\README.txt
          Compress-Archive -Path out\* -DestinationPath SoulRunner-Nova-Pindle.zip -Force
      - name: Upload SoulRunner build
        uses: actions/upload-artifact@v4
        with:
          name: SoulRunner-Nova-Pindle
          path: SoulRunner-Nova-Pindle.zip
          retention-days: 30
