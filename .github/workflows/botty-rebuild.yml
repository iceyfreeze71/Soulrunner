name: SoulRunner Nova Pindle Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout engine source
        uses: actions/checkout@v4
        with:
          repository: johannes-do/botty
          ref: master
          path: botty
      - name: Configure Nova Sorc Pindle only
        shell: powershell
        run: |
          $p = 'botty/config/params.ini'
          $c = Get-Content $p -Raw
          $c = $c -replace '(?m)^name=.*$', 'name=SoulRunner'
          $c = $c -replace '(?m)^order=.*$', 'order=run_pindle'
          $c = $c -replace '(?m)^type=.*$', 'type=nova_sorc'
          $c = $c -replace '(?m)^randomize_runs=.*$', 'randomize_runs=0'
          $c = $c -replace '(?m)^restart_d2r_when_stuck=.*$', 'restart_d2r_when_stuck=0'
          Set-Content $p $c -Encoding UTF8
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: botty
          environment-file: botty/environment.yml
          auto-activate-base: false
      - name: Build engine
        shell: cmd /C call {0}
        run: |
          cd botty
          python build.py
      - name: Build SoulRunner launcher
        shell: cmd /C call {0}
        run: pyinstaller --noconfirm --clean --onefile --windowed --name SoulRunner soulrunner_launcher.py
      - name: Package SoulRunner
        shell: powershell
        run: |
          $built = Get-ChildItem botty -Directory | Where-Object { $_.Name -like 'botty_v*' } | Select-Object -First 1
          if (-not $built) { throw 'Engine build folder missing' }
          if (-not (Test-Path "$($built.FullName)\main.exe")) { throw 'Engine executable missing' }
          New-Item -ItemType Directory -Force out\engine | Out-Null
          Copy-Item dist\SoulRunner.exe out\SoulRunner.exe
          Copy-Item "$($built.FullName)\main.exe" out\engine\main.exe
          Copy-Item -Recurse "$($built.FullName)\assets" out\engine\assets
          Copy-Item -Recurse "$($built.FullName)\config" out\engine\config
          Copy-Item botty\LICENSE.txt out\LICENSE.txt
          @'
          SOULRUNNER - NOVA PINDLE TEST

          Target: Nova Sorceress, Hell, Pindle only.

          Extract the entire ZIP. Start Diablo II: Resurrected, then run SoulRunner.exe.
          F10 starts SoulRunner. F11 stops it.

          IMPORTANT: Nova and teleport skill hotkeys still need to match the D2R character bindings in engine/config/params.ini. This build deliberately preserves the proven Pindle approach: Act 5 town pathing -> Nihlathak portal location -> visual red portal selection.

          Third-party MIT attribution is included in LICENSE.txt.
          '@ | Set-Content -Encoding UTF8 out\README.txt
          Compress-Archive -Path out\* -DestinationPath SoulRunner-Nova-Pindle.zip -Force
      - name: Upload SoulRunner build
        uses: actions/upload-artifact@v4
        with:
          name: SoulRunner-Nova-Pindle
          path: SoulRunner-Nova-Pindle.zip
          retention-days: 30
