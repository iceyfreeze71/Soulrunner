name: Botty Windows Test Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout SoulRunner
        uses: actions/checkout@v4

      - name: Checkout Botty
        uses: actions/checkout@v4
        with:
          repository: johannes-do/botty
          ref: master
          path: botty

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: botty
          environment-file: botty/environment.yml
          auto-activate-base: false

      - name: Build original Botty executable
        shell: cmd /C call {0}
        run: |
          cd botty
          python build.py

      - name: Locate and package executable build
        shell: powershell
        run: |
          $built = Get-ChildItem botty -Directory | Where-Object { $_.Name -like 'botty_v*' } | Select-Object -First 1
          if (-not $built) { throw 'Botty build folder was not created' }
          if (-not (Test-Path "$($built.FullName)\main.exe")) { throw 'main.exe was not created' }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item -Recurse "$($built.FullName)\*" out\
          Rename-Item out\main.exe SoulRunner.exe
          @'
          SOULRUNNER - BOTTY FOUNDATION TEST

          1. Extract this entire ZIP.
          2. Start Diablo II: Resurrected.
          3. Run SoulRunner.exe.

          This build is the ready-to-run Botty executable foundation. It includes Botty's assets and config folder. We are testing the Botty runtime first; the simplified F10-only Act 5 launcher comes next after this executable starts successfully on your PC.

          Original project: https://github.com/johannes-do/botty
          License: MIT (included in LICENSE.txt)
          '@ | Set-Content -Encoding UTF8 out\README-SOULRUNNER.txt
          Copy-Item botty\LICENSE.txt out\LICENSE.txt
          Compress-Archive -Path out\* -DestinationPath SoulRunner-Botty-Windows-Test.zip -Force

      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: SoulRunner-Botty-Windows-Test
          path: SoulRunner-Botty-Windows-Test.zip
          retention-days: 30
