name: Build SoulRunner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Get Botty Act 5 path templates
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          $base='https://raw.githubusercontent.com/johannes-do/botty/master/assets/templates/a5_town'
          $files=@('a5_red_portal.png','a5_town_1.png','a5_town_2.png','a5_town_3.png','a5_town_4.png','a5_town_5.png','a5_town_6.png','a5_town_11.png')
          foreach($f in $files){ Invoke-WebRequest -Uri "$base/$f" -OutFile "assets/$f" }
      - name: Apply Botty path integration
        run: python tools/apply_portal_patch.py
      - name: Build
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SoulRunner --add-data "assets;assets" launcher_gui.py
      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SoulRunner.exe package/SoulRunner.exe
          Copy-Item config.json package/config.json
          Copy-Item APPLY_UPDATE.bat package/APPLY_UPDATE.bat
          Compress-Archive -Path package/* -DestinationPath SoulRunner-update.zip -Force
      - name: Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-${{ github.run_number }}'
          gh release create $tag SoulRunner-update.zip --title $tag --notes 'SoulRunner v24.0: Botty dynamic Harrogath landmark pathing replaces the recorded F10 route.' --latest
