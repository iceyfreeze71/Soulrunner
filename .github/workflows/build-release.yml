name: Build SoulRunner Rebuild
on:
  push:
    branches: [botty-rebuild]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout SoulRunner
        uses: actions/checkout@v4
      - name: Checkout proven Botty runtime
        uses: actions/checkout@v4
        with:
          repository: johannes-do/botty
          ref: 22ab86b3877e441a61cfb46f43bf5b368d8251cf
          path: botty_upstream
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install SoulRunner and Botty Python dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
          python -m pip install --force-reinstall "numpy==1.26.4" "opencv-python==4.5.5.64"
          python -m pip install pyinstaller pywin32 transitions mss mouse keyboard beautifultable pytweening requests graphviz psutil cryptography pillow discord.py parse pyparsing typing_extensions colorama dataclasses-json
          python -m pip install --force-reinstall "rapidfuzz==2.15.2"
          $ocr = Get-ChildItem botty_upstream/dependencies/tesserocr-2.5.2-cp310-cp310-win_amd64.whl -ErrorAction SilentlyContinue
          if ($ocr) { python -m pip install $ocr.FullName }
          python -c "import numpy,cv2,pyparsing,rapidfuzz; from rapidfuzz.string_metric import levenshtein; print('NumPy',numpy.__version__,'OpenCV',cv2.__version__,'pyparsing',pyparsing.__version__,'RapidFuzz',rapidfuzz.__version__)"
      - name: Verify upstream core imports
        shell: powershell
        run: |
          $env:PYTHONPATH = "$pwd\botty_upstream\src"
          python -c "from pather import Pather; from item.pickit import PickIt; from char.sorceress import NovaSorc; from town import TownManager,A1,A2,A3,A4,A5; print('SoulRunner upstream core imports OK')"
      - name: Build SoulRunner Control Center
        shell: powershell
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name SoulRunner `
            --paths "botty_upstream/src" `
            --collect-submodules char `
            --collect-submodules item `
            --collect-submodules inventory `
            --collect-submodules town `
            --collect-submodules ui `
            --collect-submodules run `
            --add-data "botty_upstream;botty_upstream" `
            soulrunner_ui.py
      - name: Package updater payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SoulRunner/* package/ -Recurse -Force
          Copy-Item APPLY_UPDATE.bat package/APPLY_UPDATE.bat -Force
          @{ build=$env:GITHUB_RUN_NUMBER; commit=$env:GITHUB_SHA; branch='botty-rebuild'; core='botty-22ab86b' } | ConvertTo-Json | Set-Content -Encoding UTF8 package/build.json
          Compress-Archive -Path package/* -DestinationPath SoulRunner-update.zip -Force
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulRunner-botty-rebuild
          path: package/
      - name: Publish rebuild release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'rebuild-${{ github.run_number }}'
          gh release create $tag SoulRunner-update.zip --title "SoulRunner $tag" --notes "Botty-core SoulRunner test build: full upstream runtime/assets, Nova Sorc, dynamic Pather, TownManager, PickIt and new Control Center." --latest
