name: Build SoulRunner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build SoulRunner
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SoulRunner launcher_gui.py
      - name: Package update
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SoulRunner.exe package/SoulRunner.exe
          if (Test-Path config.json) { Copy-Item config.json package/config.json }
          if (Test-Path town_route.json) { Copy-Item town_route.json package/town_route.json }
          if (Test-Path APPLY_UPDATE.bat) { Copy-Item APPLY_UPDATE.bat package/APPLY_UPDATE.bat }
          Compress-Archive -Path package/* -DestinationPath SoulRunner-update.zip -Force
      - name: Publish latest update
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-${{ github.run_number }}'
          gh release create $tag SoulRunner-update.zip --title "SoulRunner $tag" --notes "SoulRunner v23.5: Harrogath confirmation is no longer a hard stop. The active town route continues after game load." --latest
