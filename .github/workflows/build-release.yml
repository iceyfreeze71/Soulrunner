name: Build SoulRunner
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build SoulRunner
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SoulRunner launcher_gui.py
      - name: Package updater release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/SoulRunner.exe package/SoulRunner.exe
          Copy-Item APPLY_UPDATE.bat package/APPLY_UPDATE.bat
          # User-owned town_route.json and config.json are intentionally NOT shipped in updater ZIPs.
          # This prevents a routine update from replacing the proven local route/settings.
          @{
            build = $env:GITHUB_RUN_NUMBER
            commit = $env:GITHUB_SHA
          } | ConvertTo-Json | Set-Content -Encoding UTF8 package/build.json
          Compress-Archive -Path package/* -DestinationPath SoulRunner-update.zip -Force
      - name: Publish latest update
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'build-${{ github.run_number }}'
          gh release create $tag SoulRunner-update.zip --title "SoulRunner $tag" --notes "Updater reliability release. Preserves local town_route.json/config.json and installs after SoulRunner fully exits." --latest
